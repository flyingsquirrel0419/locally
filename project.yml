name: Locally
options:
  bundleIdPrefix: me.teamwicked
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
packages:
  Locally:
    path: .
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
  # Vendored copy of apple/ml-stable-diffusion @ ea2805dc with the SD3/T5
  # sources (and their swift-transformers 0.1.8 pin) removed — see
  # Vendor/StableDiffusion/VENDORED.md.
  StableDiffusion:
    path: Vendor/StableDiffusion
targets:
  Locally:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: App
    entitlements:
      path: App/Locally.entitlements
    dependencies:
    - package: Locally
      product: LocallyCore
    - package: Locally
      product: LocallyDevice
    - package: Locally
      product: LocallyHF
    - package: Locally
      product: LocallyCompatibility
    - package: Locally
      product: LocallyStorage
    - package: Locally
      product: LocallyRuntime
    - package: mlx-swift-lm
      product: MLXLLM
    - package: mlx-swift-lm
      product: MLXLMCommon
    - package: mlx-swift
      product: MLX
    - package: mlx-swift
      product: MLXRandom
    - package: swift-transformers
      product: Tokenizers
    - package: mlx-swift-lm
      product: MLXVLM
    - package: StableDiffusion
      product: StableDiffusion
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Locally
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
        - fetch
        - processing
        BGTaskSchedulerPermittedIdentifiers:
        - me.teamwicked.locally.download-maintenance
        NSPhotoLibraryAddUsageDescription: Locally saves generated images to your
          photo library only when you ask it to.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally
        TARGETED_DEVICE_FAMILY: '1'
        ENABLE_USER_SCRIPT_SANDBOXING: true
        SWIFT_STRICT_CONCURRENCY: complete
  LocallyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/AppTests
    dependencies:
    - target: Locally
    - package: Locally
      product: LocallyCore
    - package: Locally
      product: LocallyHF
    - package: Locally
      product: LocallyStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
  # Package test suites re-hosted as iOS unit-test bundles so the full
  # library test matrix also runs on the simulator, not just AppTests.
  # LocallyE2ETests stays Linux-only: it is gated on LOCALLY_LIVE_E2E=1 and
  # hits the live Hugging Face API over FoundationURLSessionTransport, and it
  # needs the Linux-linked llama.cpp build (.deps) — not meaningful in the
  # simulator test run.
  LocallyCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/LocallyCoreTests
    dependencies:
    - package: Locally
      product: LocallyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.coretests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
  LocallyDeviceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/LocallyDeviceTests
    dependencies:
    - package: Locally
      product: LocallyDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.devicetests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
  LocallyHFTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/LocallyHFTests
    dependencies:
    - package: Locally
      product: LocallyHF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.hftests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
  LocallyCompatibilityTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/LocallyCompatibilityTests
    dependencies:
    - package: Locally
      product: LocallyCompatibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.compatibilitytests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
  LocallyStorageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/LocallyStorageTests
    dependencies:
    - package: Locally
      product: LocallyStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.storagetests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
  LocallyRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/LocallyRuntimeTests
    dependencies:
    - package: Locally
      product: LocallyRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.runtimetests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Locally:
    build:
      targets:
        Locally: all
        LocallyTests:
        - test
        LocallyCoreTests:
        - test
        LocallyDeviceTests:
        - test
        LocallyHFTests:
        - test
        LocallyCompatibilityTests:
        - test
        LocallyStorageTests:
        - test
        LocallyRuntimeTests:
        - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - LocallyTests
      - LocallyCoreTests
      - LocallyDeviceTests
      - LocallyHFTests
      - LocallyCompatibilityTests
      - LocallyStorageTests
      - LocallyRuntimeTests
