name: Locally
options:
  bundleIdPrefix: me.teamwicked
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages:
  Locally:
    path: .
targets:
  Locally:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    entitlements:
      path: App/Locally.entitlements
    dependencies:
      - package: Locally
        product: LocallyCore
      - package: Locally
        product: LocallyDevice
      - package: Locally
        product: LocallyHF
      - package: Locally
        product: LocallyCompatibility
      - package: Locally
        product: LocallyStorage
      - package: Locally
        product: LocallyRuntime
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Locally
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - me.teamwicked.locally.download-maintenance
        NSPhotoLibraryAddUsageDescription: "Locally saves generated images to your photo library only when you ask it to."
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
  LocallyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: Locally
      - package: Locally
        product: LocallyCore
      - package: Locally
        product: LocallyHF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.teamwicked.locally.tests
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Locally:
    build:
      targets:
        Locally: all
        LocallyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocallyTests
