name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake
        run: apt-get update && apt-get install -y --no-install-recommends cmake
      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            .deps/llama-install
            .deps/llama-build
          key: llama-v0.5.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build llama.cpp
        run: scripts/build-llama-linux.sh
      - name: Build
        run: swift build -j 2
        env:
          LOCALLY_LLAMA: "1"
      - name: Test
        run: swift test -j 2
        env:
          LOCALLY_LLAMA: "1"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate string catalogs
        run: |
          plutil -lint App/Resources/*.xcstrings
          plutil -lint App/Info.plist App/Locally.entitlements
      - name: Test (includes app build and app smoke tests)
        run: |
          xcodebuild test \
            -project Locally.xcodeproj \
            -scheme Locally \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -quiet
