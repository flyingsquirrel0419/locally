name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -j 2
      - name: Test
        run: swift test -j 2

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate string catalogs
        run: |
          plutil -lint App/Resources/*.xcstrings
          plutil -lint App/Info.plist App/Locally.entitlements
      - name: Test (includes app build and app smoke tests)
        run: |
          xcodebuild test \
            -project Locally.xcodeproj \
            -scheme Locally \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -quiet
