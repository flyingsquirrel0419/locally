name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake make gcc g++ python3
      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            .deps/llama-install
            .deps/llama-build
          key: llama-v0.5.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build llama.cpp
        run: scripts/build-llama-linux.sh
      - name: Build
        run: swift build -j 2
        env:
          LOCALLY_LLAMA: "1"
      - name: Test
        run: swift test -j 2
        env:
          LOCALLY_LLAMA: "1"
      - name: Localization coverage
        run: python3 scripts/check-localization.py
      - name: Parse-check app and vendored sources
        run: |
          find App Vendor -name '*.swift' -type f -print0 \
            | xargs -0 -n1 -P2 swiftc -parse

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache llama.cpp Apple build
        uses: actions/cache@v4
        with:
          path: .deps/llama-apple
          key: llama-apple-v0.5.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build llama.cpp Apple xcframework (iOS device + simulator)
        run: scripts/build-llama-apple.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate string catalogs and entitlements
        run: |
          for f in App/Resources/*.xcstrings; do python3 -m json.tool "$f" > /dev/null || exit 1; done
          plutil -lint App/Locally.entitlements
      - name: Test (includes app build, app smoke tests, and package tests)
        run: |
          # Keep compiling after the first error so one run reports failures
          # from all targets instead of one module per CI iteration.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          set -o pipefail
          xcodebuild test \
            -project Locally.xcodeproj \
            -scheme Locally \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -quiet 2>&1 | tee xcodebuild.log
      - name: Test results summary
        if: always()
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No TestResults.xcresult produced (build likely failed before tests ran)."
            exit 0
          fi
          {
            echo "### iOS Simulator test results"
            echo '```'
            if ! xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null; then
              # Pre-Xcode-16 fallback: legacy JSON export with a compact summary.
              xcrun xcresulttool get --legacy --format json --path TestResults.xcresult \
                | python3 -c '
                    import json,sys
                    d=json.load(sys.stdin)
                    for t in d.get("issues",{}).get("testFailureSummaries",{}).get("_values",[]):
                        print("FAIL:", t.get("message",{}).get("_value",""))
                    m=d.get("metrics",{})
                    print("tests:", m.get("testsCount",{}).get("_value","?"),
                          "failures:", m.get("testsFailedCount",{}).get("_value","?"))
                  '
            fi
            echo '```'
          } | tee /dev/stderr >> "$GITHUB_STEP_SUMMARY"
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
          compression-level: 9
      - name: Surface build errors in step summary
        if: failure()
        run: |
          {
            echo "### xcodebuild errors"
            echo '```'
            grep -E "error:" xcodebuild.log | sed 's/^.*Z //' | sort -u | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
